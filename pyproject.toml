[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hebedtf"
version = "0.1.0"
description = "Hebrew Extended Date/Time Format (EDTF) library for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["hebrew", "edtf", "date", "calendar", "pyluach"]
authors = [
    { name = "Danni Dissen" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyluach>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
